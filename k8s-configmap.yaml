apiVersion: v1
kind: ConfigMap
metadata:
  name: neshangeocodingapi-config
  namespace: alborzdc-neshan-geo-coding-api
data:
  appsettings.Docker.json: |
    {
      "ConnectionStrings": {
        "DefaultConnection": "Data Source=/app/data/neshan_geocoding.db"
      },
      "Neshan": {
        "ApiKey": "",
        "RateLimit": {
          "RequestsPerMinute": 60,
          "DelayBetweenRequests": 1000,
          "MaxConcurrentRequests": 5,
          "RetryOnRateLimit": true,
          "MaxRetries": 3,
          "RetryDelay": 2000
        },
        "ProcessingLimits": {
          "MaxAddressesPerFile": 50,
          "EnableProcessingLimits": true,
          "SkipRemainingAddresses": true,
          "ShowLimitWarning": true
        }
      },
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning",
          "Microsoft.EntityFrameworkCore": "Warning"
        }
      },
      "AllowedHosts": "*"
    }
---
# The API key Secret is created out of band and is never stored in this repository.
